<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--bg2:#12121a;--line:rgba(255,255,255,.1);--txt:#f5f2ea;--mut:#a29fa8;--gold:#e7b75f;--gold2:#f6d58e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{font-family:Inter,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
.serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.025em}
.grad{background:linear-gradient(120deg,var(--gold2),var(--gold) 50%,#d98a3d);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
#s{position:relative;overflow:hidden;background:var(--bg)}
#s::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0 0,rgba(192,121,43,.4),transparent 45%),radial-gradient(circle at 100% 100%,rgba(59,76,202,.28),transparent 45%)}
#s::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent);opacity:.5}
.in{position:absolute;inset:0;z-index:2;padding:84px 86px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:28px}
.brand i{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--gold),#c0792b);display:grid;place-items:center;color:#1a1204;font-style:normal;font-weight:800;font-size:25px}
.top{display:flex;justify-content:space-between;align-items:center}
.pg{font-size:24px;color:var(--mut);font-weight:600;letter-spacing:.08em}
.eyebrow{color:var(--gold);font-size:24px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.big{font-size:104px;line-height:1.02}
.mid{font-size:84px;line-height:1.05}
.body{font-size:38px;line-height:1.4;color:#d6d3da}
.mut{color:var(--mut)}
.spacer{flex:1}
.chip{display:inline-flex;gap:12px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:14px 26px;border-radius:999px;font-size:26px;color:var(--gold2)}
.chip b{width:12px;height:12px;border-radius:50%;background:#4ade80;box-shadow:0 0 14px #4ade80}
.swipe{display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:var(--gold2)}
.swipe svg{width:34px;height:34px}
.cta{display:inline-flex;align-items:center;gap:14px;padding:30px 50px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204;font-weight:700;font-size:34px;box-shadow:0 20px 60px rgba(231,183,95,.3)}
.cmp{display:grid;gap:26px;margin-top:50px}
.row{display:flex;gap:26px}
.box{flex:1;border-radius:30px;padding:38px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.box h4{font-size:26px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px;font-weight:700}
.box.bad h4{color:#ff7a7a}.box.good{border-color:rgba(231,183,95,.5);background:rgba(231,183,95,.07)}.box.good h4{color:var(--gold2)}
.box li{list-style:none;font-size:32px;line-height:1.3;padding:12px 0 12px 48px;position:relative}
.box.bad li::before{content:"✕";position:absolute;left:0;color:#ff7a7a;font-weight:800}
.box.good li::before{content:"✓";position:absolute;left:0;color:#4ade80;font-weight:800}
.num{font-family:Fraunces,serif;font-size:260px;line-height:.9;color:var(--gold);opacity:.9}
.ic{width:130px;height:130px;border-radius:38px;background:rgba(231,183,95,.1);border:2px solid rgba(231,183,95,.3);display:grid;place-items:center;color:var(--gold2)}
.ic svg{width:66px;height:66px}
.phone{position:absolute;left:50%;width:560px;margin-left:-280px;border-radius:78px;padding:16px;background:#1b1b24;border:3px solid #3a3a48;box-shadow:0 60px 120px -20px #000,0 0 0 2px #000;overflow:hidden}
.phone img{display:block;width:100%;border-radius:62px}
.tag{display:inline-block;padding:12px 26px;border-radius:999px;font-size:24px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--c);color:var(--c)}
.tags{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.tags span{font-size:24px;padding:8px 20px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#e4e1e8}
.cir{position:absolute;border-radius:50%;border:2px solid rgba(231,183,95,.25)}
</style>
</head>
<body>
<div id="s"></div>
<script>
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const I=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS={
 wa:I('<path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-5.4A8 8 0 1 1 21 12z"/>'),
 globe:I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
 phone:I('<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>'),
 coin:I('<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2.5 0 0 0-2.5-1.5c-1.5 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.8 2.5 2-1 2-2.5 2A2.7 2.7 0 0 1 9.5 15M12 6v1.5M12 16.5V18"/>'),
 cal:I('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
 bag:I('<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/>'),
 bolt:I('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'),
 bed:I('<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/>'),
 fork:I('<path d="M6 3v7a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-3 5-3 8h3v10"/>'),
 car:I('<path d="M5 16l1.5-5.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 16M3 16h18v3H3z"/><circle cx="7.5" cy="19" r=".5"/><circle cx="16.5" cy="19" r=".5"/>'),
 spark:I('<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>'),
 drop:I('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'),
 steam:I('<path d="M8 3c-1.5 2 1.5 3 0 5M12 3c-1.5 2 1.5 3 0 5M16 3c-1.5 2 1.5 3 0 5M4 14h16a8 8 0 0 1-16 0z"/>'),
 hello:I('<path d="M7 11V6a1.5 1.5 0 0 1 3 0v4M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V6a1.5 1.5 0 0 1 3 0v6l1-1a1.5 1.5 0 0 1 2 2l-3 6a4 4 0 0 1-4 2h-1a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-2L7 13"/>')
};
const brand='<div class="brand"><i>V</i>Vitrine</div>';
const hdr=(n,t)=>`<div class="top">${brand}<span class="pg">${n}/${t}</span></div>`;
const swipe='<div class="swipe">Glissez '+arrow+'</div>';
const dm='<span class="mut" style="font-size:28px">Écrivez « SITE » en message privé</span>';
const DEMOS={
 'salon-jamila':{n:'Salon Jamila',ar:'صالون جميلة',t:'Salon de beauté',c:'#f0b8a4',ic:'spark',d:'Réservation en ligne avec créneaux, jours bloqués et confirmation WhatsApp.',s:['Réservation','Admin','WhatsApp']},
 'snack-lmoumen':{n:'Snack Lmoumen',ar:'سناك المومن',t:'Restaurant',c:'#f5a623',ic:'fork',d:'Menu digital, panier et commande envoyée directement sur WhatsApp.',s:['Menu','Panier','WhatsApp']},
 'riad-nour':{n:'Riad Nour',ar:'رياض نور',t:'Riad & maison d\'hôtes',c:'#3ccdc7',ic:'bed',d:'Chambres, calendrier de disponibilité et calcul des nuitées.',s:['Calendrier','Tarifs','4 langues']},
 'hammam-salam':{n:'Hammam Salam',ar:'حمام السلام',t:'Hammam & spa',c:'#5ed6c4',ic:'steam',d:'Espaces Femmes et Hommes, 11 soins, forfaits et cartes cadeaux.',s:['Horaires','Forfaits','Cadeaux']},
 'auto-ecole-najah':{n:'Auto-École Najah',ar:'أوطو إيكول النجاح',t:'Auto-école',c:'#ff8a45',ic:'car',d:'Formules, réservation de créneaux, suivi de parcours et quiz du code.',s:['Quiz','Suivi','Réservation']},
 'meilou':{n:'Meilou',ar:'ميلو',t:'Boutique amlou & miel',c:'#e7b75f',ic:'bag',d:'Boutique de 10 produits, panier, livraison offerte dès un seuil et WhatsApp.',s:['Boutique','Panier','Livraison']}
};
const S={};
S.welcome=()=>({w:1080,h:1350,html:`<div class="in">
 <div class="top">${brand}<span class="chip"><b></b>6 apps en ligne</span></div>
 <div class="spacer"></div>
 <div class="eyebrow">Sites &amp; apps web · Maroc</div>
 <h1 class="serif big" style="margin:26px 0 30px">Votre commerce mérite mieux qu'une <span class="grad">page Facebook</span></h1>
 <p class="body" style="max-width:820px">Réservation en ligne, commande WhatsApp, prix en dirhams. En français, darija, arabe et anglais.</p>
 <div class="spacer"></div>
 <div style="display:flex;justify-content:space-between;align-items:center">${swipe}<span class="mut" style="font-size:26px">fr · الدارجة · عربي · en</span></div>
</div>`});
const fbSlides=[
 s=>`<div class="in">${hdr(1,5)}<div class="spacer"></div><div class="eyebrow">Comparatif</div><h1 class="serif big" style="margin:26px 0 30px">Page Facebook <span class="grad">ou vrai site ?</span></h1><p class="body">Ce que vos clients voient avant de vous appeler.</p><div class="spacer"></div>${swipe}</div>`,
 s=>`<div class="in">${hdr(2,5)}<div class="eyebrow" style="margin-top:80px">Être trouvé</div><h2 class="serif mid" style="margin:22px 0">Google ne montre pas votre page</h2><div class="cmp"><div class="box bad"><h4>Page Facebook</h4><ul><li>Peu visible sur Google</li><li>Il faut un compte pour tout voir</li></ul></div><div class="box good"><h4>Votre site</h4><ul><li>Référencé par ville et métier</li><li>Accessible à tous, sans compte</li></ul></div></div><div class="spacer"></div>${swipe}</div>`,
 s=>`<div class="in">${hdr(3,5)}<div class="eyebrow" style="margin-top:80px">Réserver</div><h2 class="serif mid" style="margin:22px 0">Fini les 20 messages pour un rendez-vous</h2><div class="cmp"><div class="box bad"><h4>Page Facebook</h4><ul><li>« Disponible demain ? »</li><li>Réponses à la main</li></ul></div><div class="box good"><h4>Votre site</h4><ul><li>Créneaux visibles en direct</li><li>Confirmation sur WhatsApp</li></ul></div></div><div class="spacer"></div>${swipe}</div>`,
 s=>`<div class="in">${hdr(4,5)}<div class="eyebrow" style="margin-top:80px">Image de marque</div><h2 class="serif mid" style="margin:22px 0">Votre identité, pas celle de Facebook</h2><div class="cmp"><div class="box bad"><h4>Page Facebook</h4><ul><li>Même look que 1000 pages</li><li>Pas de menu ni de tarifs clairs</li></ul></div><div class="box good"><h4>Votre site</h4><ul><li>Couleurs et ambiance de votre métier</li><li>Prix en MAD, bien présentés</li></ul></div></div><div class="spacer"></div>${swipe}</div>`,
 s=>`<div class="in">${hdr(5,5)}<div class="spacer"></div><div class="eyebrow">Passez à l'action</div><h2 class="serif big" style="margin:26px 0 30px">On en parle <span class="grad">cette semaine ?</span></h2><p class="body" style="margin-bottom:56px">Je vous montre une démo adaptée à votre métier.</p><div><span class="cta">Écrivez « SITE » en message privé ${arrow}</span></div><div class="spacer"></div></div>`
];
fbSlides.forEach((f,i)=>S['fb'+(i+1)]=()=>({w:1080,h:1350,html:f()}));
const waItems=[
 ['wa','Le message est déjà écrit','Le client appuie sur un bouton : sa réservation ou sa commande arrive sur le WhatsApp du commerçant, avec tous les détails.'],
 ['phone','Aucune application à installer','Un simple lien. Vos clients ouvrent le site depuis leur téléphone, comme ils ouvrent un message.'],
 ['coin','Pas de paiement en ligne obligatoire','Cash à la livraison ou à l\'arrivée : le site s\'adapte à la façon dont vos clients paient vraiment.']
];
S.wa1=()=>({w:1080,h:1350,html:`<div class="in">${hdr(1,5)}<div class="spacer"></div><div class="eyebrow">3 raisons</div><h1 class="serif big" style="margin:26px 0 30px">Pourquoi <span class="grad">WhatsApp d'abord</span> ?</h1><p class="body">Parce que vos clients y sont déjà.</p><div class="spacer"></div>${swipe}</div>`});
waItems.forEach((it,i)=>S['wa'+(i+2)]=()=>({w:1080,h:1350,html:`<div class="in">${hdr(i+2,5)}<div class="spacer"></div><div class="num">0${i+1}</div><div class="ic" style="margin:20px 0 34px">${ICONS[it[0]]}</div><h2 class="serif mid" style="margin-bottom:28px">${it[1]}</h2><p class="body">${it[2]}</p><div class="spacer"></div>${swipe}</div>`}));
S.wa5=()=>({w:1080,h:1350,html:`<div class="in">${hdr(5,5)}<div class="spacer"></div><div class="eyebrow">Votre tour</div><h2 class="serif big" style="margin:26px 0 30px">Vos clients vous <span class="grad">écrivent déjà</span> sur WhatsApp</h2><p class="body" style="margin-bottom:56px">Donnez-leur un site qui leur répond.</p><div><span class="cta">Écrivez « SITE » en message privé ${arrow}</span></div><div class="spacer"></div></div>`});
Object.entries(DEMOS).forEach(([k,d])=>S['demo-'+k]=()=>({w:1080,h:1350,html:`<div class="in" style="padding-bottom:0">
 <div class="top">${brand}<span class="tag" style="--c:${d.c}">${d.t}</span></div>
 <div style="margin-top:56px"><div style="font-size:34px;color:${d.c};margin-bottom:6px">${d.ar}</div><h1 class="serif" style="font-size:98px;line-height:1.02">${d.n}</h1><p class="body" style="margin-top:20px;max-width:760px;font-size:34px">${d.d}</p><div class="tags">${d.s.map(x=>`<span>${x}</span>`).join('')}</div></div>
 </div>
 <div class="phone" style="top:640px;box-shadow:0 -10px 90px -20px ${d.c}88,0 60px 120px -20px #000"><img src="shots/${k}.png"></div>`}));
S.offer=()=>({w:1080,h:1350,html:`<div class="in">${hdr(1,1)}<div class="spacer"></div><div class="eyebrow">Offre de lancement</div><h1 class="serif big" style="margin:26px 0 30px">Audit <span class="grad">gratuit</span> de votre présence en ligne</h1><p class="body">Je regarde votre page, vos avis et votre Google Maps, puis je vous dis ce qui vous fait perdre des clients.</p><div class="spacer"></div><div><span class="cta">Écrivez « AUDIT » en message privé ${arrow}</span></div><div class="spacer"></div></div>`});
S.avatar=()=>({w:1080,h:1080,html:`<div style="position:absolute;inset:0;z-index:2;display:grid;place-items:center"><div style="width:560px;height:560px;border-radius:170px;background:linear-gradient(135deg,var(--gold),#c0792b);display:grid;place-items:center;color:#1a1204;font-family:Fraunces,serif;font-weight:600;font-size:400px;line-height:1;padding-bottom:30px;box-shadow:0 40px 120px rgba(231,183,95,.35)">V</div></div>`});
const HL={demos:['spark','Démos'],salon:['cal','Salon'],resto:['fork','Resto'],riad:['bed','Riad'],offre:['bolt','Offre'],contact:['wa','Contact']};
Object.entries(HL).forEach(([k,v])=>S['hl-'+k]=()=>({w:1080,h:1920,html:`<div style="position:absolute;inset:0;z-index:2;display:grid;place-items:center"><div style="width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(231,183,95,.28),rgba(231,183,95,.06));border:6px solid var(--gold);display:grid;place-items:center;color:var(--gold2)"><div style="width:240px;height:240px">${ICONS[v[0]].replace('<svg','<svg style="width:100%;height:100%"')}</div></div></div>`}));
const id=location.hash.slice(1)||'welcome';
const r=S[id]();
const el=document.getElementById('s');
el.style.width=r.w+'px';el.style.height=r.h+'px';el.innerHTML=r.html;
document.body.dataset.w=r.w;document.body.dataset.h=r.h;
document.fonts.ready.then(()=>{document.body.dataset.ready=1});
window.IDS=Object.keys(S);
</script>
</body>
</html>
